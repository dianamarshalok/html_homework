<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Мистецтво SVG: фігури та анімація</title>
  <style>
    svg {
      border: 1px solid black;
      margin: 10px;
    }
    @keyframes ellipseAnimation {
      0% {
        fill: yellow;
        cy: 100;
        rx: 50;
        ry: 50;
        animation-timing-function: cubic-bezier(0.45, 0, 1, 1);
      }
      25% {
        fill: green;
        cy: 150;
        rx: 50;
        ry: 50;
      }
      50% {
        fill: red;
        cy: 170;
        rx: 70;
        ry: 30;
        animation-timing-function: cubic-bezier(0, 0, 0.55, 1);
      }
      100% {
        fill: yellow;
        cy: 100;
        rx: 50;
        ry: 50;
        animation-timing-function: cubic-bezier(0.45, 0, 1, 1);
      }
    }
    .ellipse--animation ellipse {
      animation: ellipseAnimation 0.8s infinite; ;
    }
  </style>
</head>
<body>
  <svg width="200" height="200" >
    <rect x="10" y="10" width="100" height="100" stroke="black" stroke-width="5" fill="blue"></rect>
  </svg>
  <svg width="200" height="200">
    <rect x="25" y="75" width="150" height="50" stroke="blue" stroke-width="5" fill="red"></rect>
  </svg>
  <svg width="200" height="200">
    <circle cx="100" cy="100" r="50" stroke="green" stroke-width="5" fill="yellow"></circle>  
  </svg>
  <svg width="200" height="200">
    <ellipse cx="100" cy="100" rx="80" ry="50" stroke="yellow" stroke-width="5" fill="orange"></ellipse>
  </svg>
  <svg width="200" height="200" class="ellipse--animation">
    <ellipse cx="100" cy="100" rx="50" ry="50" stroke="yellow" stroke-width="5" fill="yellow"></ellipse>
  </svg>
</body>
</html>
