<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Таблиця Мондріана</title>
</head>
<body>
  <table>
    <tr class="tr1">
      <td class="td1" colspan="2"></td>
      <td class="td2" colspan="2"></td>
      <td class="td3" colspan="2"></td>
      <td class="td4" rowspan="4"></td>
    </tr>
    <tr class="tr2">
      <td class="td1"></td>
      <td class="td2" colspan="3" rowspan="2"></td>
      <td class="td3" colspan="2"></td>
    </tr>
    <tr class="tr3">
      <td class="td1" rowspan="2"></td>
      <td class="td2"></td>
      <td class="td3"></td>
    </tr>
    <tr class="tr4">
      <td class="td1" rowspan="2"></td>
      <td class="td2" rowspan="2"></td>
      <td class="td3"></td>
      <td class="td4" colspan="2"></td>
    </tr>
    <tr class="tr5">
      <td class="td1" rowspan="3"></td>
      <td class="td2"></td>
      <td class="td3" rowspan="2" colspan="2"></td>
      <td class="td4" rowspan="3"></td>
    </tr>
    <tr class="tr6">
      <td class="td1" rowspan="2" colspan="2"></td>
      <td class="td2"></td>
    </tr>
    <tr class="tr7">
      <td class="td1" colspan="3"></td>
    </tr>
  </table>
</body>
</html>
